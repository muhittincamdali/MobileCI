# Generated by MobileCI 2.0.0 (https://github.com/muhittincamdali/MobileCI) for the Flutter project in Examples/flutter_sample.
# Edit it like any workflow and check it with `mobileci lint`; `mobileci init --force` writes it again.
name: Flutter project (Examples/flutter_sample)

on:
  push:
    branches: ['main']
    paths:
      - 'Examples/flutter_sample/**'
      - '.github/workflows/example-flutter.yml'
  pull_request:
    paths:
      - 'Examples/flutter_sample/**'
      - '.github/workflows/example-flutter.yml'
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older runs; pushes to the branch run to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: 'Examples/flutter_sample'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
