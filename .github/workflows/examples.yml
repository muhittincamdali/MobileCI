# Generated by MobileCI 2.0.0 (https://github.com/muhittincamdali/MobileCI) for the iOS app in Examples/WorkflowCheck.
# Edit it like any workflow and check it with `mobileci lint`; `mobileci init --force` writes it again.
name: iOS app (Examples/WorkflowCheck)

on:
  push:
    branches: ['main']
    paths:
      - 'Examples/WorkflowCheck/**'
      - '.github/workflows/examples.yml'
  pull_request:
    paths:
      - 'Examples/WorkflowCheck/**'
      - '.github/workflows/examples.yml'
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older runs; pushes to the branch run to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    defaults:
      run:
        working-directory: 'Examples/WorkflowCheck'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show the toolchain
        run: xcodebuild -version

      - name: Build and test
        env:
          PROJECT: 'WorkflowCheck.xcodeproj'
          SCHEME: 'WorkflowCheck'
          DESTINATION: 'platform=iOS Simulator,name=iPhone 17,OS=latest'
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      - name: Upload the result bundle
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TestResults
          path: 'Examples/WorkflowCheck/TestResults.xcresult'
          if-no-files-found: ignore
