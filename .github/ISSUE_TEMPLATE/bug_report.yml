name: Bug report
description: A wrong finding, a missed problem, a generated workflow that fails, or a crash.
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Command
      options:
        - mobileci detect
        - mobileci init
        - mobileci lint
        - mobileci version
        - GitHub Action
        - MobileCIKit (library)
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Input
      description: The workflow, project layout or version file, reduced to the smallest one that shows the problem. Remove secrets and private names.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened and what you expected
      description: The command you ran, its output, and the output you expected.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `mobileci --version`, or the commit you built.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: macOS or Linux version, Swift or Xcode version, runner label for the action.
