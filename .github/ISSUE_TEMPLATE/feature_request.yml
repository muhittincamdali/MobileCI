name: Rule or feature request
description: A mobile CI problem MobileCI should find, or a project kind it should support.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What goes wrong in CI today, and what it costs (failed releases, macOS minutes, a security risk).
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example
      description: A workflow or project layout that shows it.
      render: yaml
  - type: textarea
    id: proposal
    attributes:
      label: Proposed rule or behaviour
      description: What MobileCI should report or write, and how a user would fix it.
