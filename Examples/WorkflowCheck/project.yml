# XcodeGen spec for WorkflowCheck.xcodeproj. The project file is committed, so XcodeGen is only
# needed after changing this file: run `xcodegen` in this folder.
name: WorkflowCheck
options:
  bundleIdPrefix: io.github.muhittincamdali
  deploymentTarget:
    iOS: "17.0"
packages:
  MobileCI:
    path: ../..
targets:
  WorkflowCheck:
    type: application
    platform: iOS
    sources: [WorkflowCheck]
    dependencies:
      - package: MobileCI
        product: MobileCIKit
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Workflow Check
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES
  WorkflowCheckTests:
    type: bundle.unit-test
    platform: iOS
    sources: [WorkflowCheckTests]
    dependencies:
      - target: WorkflowCheck
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  WorkflowCheck:
    build:
      targets:
        WorkflowCheck: all
        WorkflowCheckTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WorkflowCheckTests
